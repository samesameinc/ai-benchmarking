[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_benchmarking"]

[project]
name = "ai-benchmarking"
version = "0.6.0"
description = "A benchmarking framework for evaluating LLM accuracy and safety in suicide risk assessment using the C-SSRS scale."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.29.0",
    "google-genai>=2.20.0",
    "anthropic>=1.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "pandas>=3.0.3",
    "tqdm>=4.67.3",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "tqdm.*",
    "dotenv.*",
]
ignore_missing_imports = true